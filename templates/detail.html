<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>{{ news_item.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9f9f9; font-family: "Microsoft YaHei", sans-serif; }
    .navbar { background: linear-gradient(90deg, #007bff, #00c6ff); }
    .navbar-brand { color: white !important; font-weight: bold; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 20px; }
    .card-title { font-size: 1.5rem; font-weight: bold; color: #007bff; }
    .card-text { color: #333; line-height: 1.6; white-space: pre-line; } /* 保留换行 */
    .news-date { font-size: 0.85rem; color: #888; margin-bottom: 10px; display: block; }
    footer { margin-top: 30px; text-align: center; padding: 20px; background-color: #f1f1f1; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/">新闻聚合平台</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">{{ news_item.title }}</h5>
      {% if news_item.created_at %}
        <span class="news-date">发布时间：{{ news_item.created_at }}</span>
      {% endif %}
      <p class="card-text">{{ news_item.content or "暂无内容" }}</p>
      <a href="/" class="btn btn-primary mt-3">返回首页</a>
    </div>
  </div>
</div>

<footer>
  &copy; {{ year }} 我的新闻聚合 | Powered by FastAPI
</footer>
</body>
</html>
