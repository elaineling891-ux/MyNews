<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>新闻聚合</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9f9f9; font-family: "Microsoft YaHei", sans-serif; }
    .navbar { background: linear-gradient(90deg, #007bff, #00c6ff); }
    .navbar-brand { color: white !important; font-weight: bold; }
    .list-group-item { cursor: pointer; }
    footer { margin-top: 30px; text-align: center; padding: 20px; background-color: #f1f1f1; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/">新闻聚合平台</a>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="mb-4">最新新闻</h2>
  <div class="list-group">
    {% for item in news %}
      <a href="/news/{{ loop.index0 }}" class="list-group-item list-group-item-action">
        {{ item.title }}
      </a>
    {% endfor %}
  </div>
</div>

<footer>
  &copy; {{ year }} 我的新闻聚合 | Powered by FastAPI
</footer>
</body>
</html>
