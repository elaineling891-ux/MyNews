<!DOCTYPE html>
<html lang="zh">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9f9f9; font-family: "Microsoft YaHei", sans-serif; }
    .navbar { background: linear-gradient(90deg, #007bff, #00c6ff); }
    .navbar-brand { color: white !important; font-weight: bold; }
    .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-control { border-radius: 8px; }
    footer { margin-top: 30px; text-align: center; padding: 20px; background-color: #f1f1f1; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/">新闻聚合平台</a>

</nav>

<div class="container mt-4">
  <div class="card p-4">
    <h2 class="mb-3">联系我们</h2>
    <p>如果您有任何问题、合作意向或反馈，请通过以下方式联系我们：</p>
    <ul>
      <li>📧 邮箱：elaine.ling891@gmail.com</li>
    </ul>
    <hr>
    <h4>留言表单</h4>
    <form>
      <div class="mb-3">
        <label class="form-label">姓名</label>

      <div class="mb-3">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-control" placeholder="请输入您的邮箱">

      <div class="mb-3">
        <label class="form-label">留言</label>

<footer>

</html>
